<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기술 지표 조회</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --line: #d9e0ea;
      --text: #182230;
      --muted: #667085;
      --accent: #0f766e;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 16px;
      padding: 16px;
      min-height: calc(100vh - 67px);
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 0;
    }
    .controls {
      padding: 14px;
      display: grid;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    input, select, button {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      background: #fff;
      font: inherit;
    }
    button {
      cursor: pointer;
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .button-row button {
      background: #fff;
      color: var(--accent);
    }
    .indicator-list {
      max-height: calc(100vh - 285px);
      overflow: auto;
      padding: 8px;
    }
    .indicator-item {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      align-items: start;
      padding: 8px;
      border-radius: 6px;
    }
    .indicator-item:hover { background: #eef6f5; }
    .indicator-item input { min-height: 18px; margin-top: 2px; }
    .indicator-name { font-size: 13px; font-weight: 700; line-height: 1.35; }
    .indicator-meta { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }
    .status {
      color: var(--muted);
      font-size: 13px;
    }
    .table-wrap { overflow: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
      z-index: 1;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .error { color: var(--danger); }
    .spark {
      display: flex;
      gap: 2px;
      align-items: end;
      height: 28px;
      min-width: 110px;
    }
    .bar {
      width: 4px;
      min-height: 2px;
      background: #7aa7a2;
      border-radius: 2px 2px 0 0;
    }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .indicator-list { max-height: 360px; }
      .results-header { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>기술 지표 조회</h1>
  </header>
  <main>
    <section>
      <div class="controls">
        <label>종목코드
          <input id="stockCode" value="005930" inputmode="numeric" maxlength="6">
        </label>
        <label>조회 일수
          <input id="days" type="number" min="30" max="1000" value="260">
        </label>
        <label>검색
          <input id="search" placeholder="RSI, MACD, 이동평균...">
        </label>
        <label>분류
          <select id="category"></select>
        </label>
        <div class="button-row">
          <button id="selectAll" type="button">전체 선택</button>
          <button id="clearAll" type="button">선택 해제</button>
        </div>
        <button id="run" type="button">선택 지표 조회</button>
      </div>
      <div id="indicatorList" class="indicator-list"></div>
    </section>
    <section>
      <div class="results-header">
        <div>
          <strong id="resultTitle">결과</strong>
          <div id="status" class="status">지표 목록을 불러오는 중</div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>지표</th>
              <th>분류</th>
              <th>최신값</th>
              <th>파라미터</th>
              <th>최근 흐름</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const state = { indicators: [], selected: new Set() };
    const listEl = document.getElementById("indicatorList");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const categoryEl = document.getElementById("category");
    const searchEl = document.getElementById("search");

    function formatValue(value) {
      if (value === null || value === undefined || value === "") return "-";
      if (typeof value === "number") return Number.isInteger(value) ? value.toLocaleString() : value.toLocaleString(undefined, { maximumFractionDigits: 6 });
      return String(value);
    }

    function renderSpark(series) {
      const values = series.map((point) => point.value).filter((value) => typeof value === "number");
      if (!values.length) return "";
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = max - min || 1;
      return `<div class="spark">${values.slice(-24).map((value) => {
        const height = 3 + ((value - min) / span) * 25;
        return `<span class="bar" style="height:${height}px"></span>`;
      }).join("")}</div>`;
    }

    function visibleIndicators() {
      const query = searchEl.value.trim().toLowerCase();
      const category = categoryEl.value;
      return state.indicators.filter((item) => {
        const text = `${item.id} ${item.label} ${item.function_name}`.toLowerCase();
        return (!category || item.category === category) && (!query || text.includes(query));
      });
    }

    function renderCategories() {
      const categories = Array.from(new Set(state.indicators.map((item) => item.category))).sort();
      categoryEl.innerHTML = `<option value="">전체</option>${categories.map((category) => `<option value="${category}">${category}</option>`).join("")}`;
    }

    function renderIndicators() {
      const items = visibleIndicators();
      listEl.innerHTML = items.map((item) => {
        const checked = state.selected.has(item.id) ? "checked" : "";
        const params = item.parameters.map((param) => `${param.name}=${param.default ?? "필수"}`).join(", ") || "기본값 없음";
        return `
          <label class="indicator-item">
            <input type="checkbox" data-id="${item.id}" ${checked}>
            <span>
              <span class="indicator-name">${item.label}</span>
              <span class="indicator-meta"><code>${item.id}</code> · ${item.category} · ${params}</span>
            </span>
          </label>
        `;
      }).join("");
      statusEl.textContent = `${state.indicators.length}개 지표 중 ${items.length}개 표시, ${state.selected.size}개 선택`;
    }

    async function loadCatalog() {
      const response = await fetch("/technical/indicators");
      const payload = await response.json();
      state.indicators = payload.indicators;
      state.selected = new Set(state.indicators.map((item) => item.id));
      renderCategories();
      renderIndicators();
    }

    async function runIndicators() {
      const code = document.getElementById("stockCode").value.trim();
      const days = document.getElementById("days").value;
      const ids = Array.from(state.selected);
      if (!code || !ids.length) {
        statusEl.textContent = "종목코드와 지표를 선택해야 합니다";
        return;
      }
      statusEl.textContent = "계산 중";
      resultsEl.innerHTML = "";
      const url = `/technical/indicators/${encodeURIComponent(code)}?days=${encodeURIComponent(days)}&ids=${encodeURIComponent(ids.join(","))}`;
      const response = await fetch(url);
      const payload = await response.json();
      document.getElementById("resultTitle").textContent = `${payload.stock_code} · ${payload.indicators.length}개 지표`;
      if (payload.errors?.length) {
        statusEl.textContent = payload.errors.map((error) => error.message).join(" / ");
      } else {
        statusEl.textContent = "계산 완료";
      }
      resultsEl.innerHTML = payload.indicators.map((item) => {
        const params = Object.entries(item.parameters || {}).map(([key, value]) => `${key}=${value}`).join(", ") || "-";
        const status = item.error ? `<span class="error">${item.error}</span>` : (item.uses_default_benchmark ? "기본 벤치마크 사용" : "정상");
        return `
          <tr>
            <td><strong>${item.label}</strong><br><code>${item.id}</code></td>
            <td>${item.category}</td>
            <td>${formatValue(item.value)}</td>
            <td><code>${params}</code></td>
            <td>${renderSpark(item.series || [])}</td>
            <td>${status}</td>
          </tr>
        `;
      }).join("");
    }

    listEl.addEventListener("change", (event) => {
      const id = event.target?.dataset?.id;
      if (!id) return;
      if (event.target.checked) state.selected.add(id);
      else state.selected.delete(id);
      renderIndicators();
    });
    searchEl.addEventListener("input", renderIndicators);
    categoryEl.addEventListener("change", renderIndicators);
    document.getElementById("selectAll").addEventListener("click", () => {
      visibleIndicators().forEach((item) => state.selected.add(item.id));
      renderIndicators();
    });
    document.getElementById("clearAll").addEventListener("click", () => {
      visibleIndicators().forEach((item) => state.selected.delete(item.id));
      renderIndicators();
    });
    document.getElementById("run").addEventListener("click", runIndicators);

    loadCatalog().catch((error) => {
      statusEl.textContent = `지표 목록 로드 실패: ${error.message}`;
    });
  </script>
</body>
</html>
